server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy стоит впереди и уже отдаёт реальный IP клиента
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Аудио и статика с хешируемым содержимым — кешируем надолго
    location ~* \.(m4a|mp3|ogg|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML/CSS/JS меняются при деплое — перепроверять на сервере
    location ~* \.(html|css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript text/plain;
    gzip_min_length 512;
}
