name: Сборка и публикация образа

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: wheel-of-fortune, context: ., arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { image: wheel-of-fortune, context: ., arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { image: wheel-collector, context: ./collector, arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { image: wheel-collector, context: ./collector, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка для ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Сохранить digest для манифеста
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        image: [wheel-of-fortune, wheel-collector]

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать multiarch-образ
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          tags=(-t "$image:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == main ]]; then
            tags+=(-t "$image:latest")
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=(-t "$image:$GITHUB_REF_NAME")
          fi
          cd /tmp/digests
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA::7}"
