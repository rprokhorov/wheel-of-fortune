name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Юниты бегут за доли секунды — гоняем их первыми,
      # чтобы не ждать установки браузеров ради очевидной поломки
      - name: Юнит-тесты
        run: npm run test:unit

      - name: Установка браузеров
        run: npx playwright install --with-deps chromium webkit

      - name: E2E-тесты
        run: npm run test:e2e

      - name: Отчёт
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
