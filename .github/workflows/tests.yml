name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Секреты в истории Git
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            collector/package-lock.json

      - name: Установка зависимостей
        run: |
          npm ci
          npm ci --prefix collector

      - name: Метаданные релиза и аудит зависимостей
        run: |
          npm run check:release
          npm audit --audit-level=moderate
          npm audit --prefix collector --audit-level=moderate

      # Юниты бегут за доли секунды — гоняем их первыми,
      # чтобы не ждать установки браузеров ради очевидной поломки
      - name: Юнит-тесты
        run: npm run test:unit

      - name: Установка браузеров
        run: npx playwright install --with-deps chromium

      - name: E2E-тесты
        run: npm run test:e2e

      - name: Отчёт
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
