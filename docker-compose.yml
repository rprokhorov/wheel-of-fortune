services:
  site:
    image: ghcr.io/rprokhorov/wheel-of-fortune:${TAG:-latest}
    # Локальная сборка вместо готового образа: docker compose up --build
    build: .
    container_name: wheel-site
    restart: unless-stopped
    expose:
      - "80"
    networks: [wheel]

  caddy:
    image: caddy:2-alpine
    container_name: wheel-caddy
    restart: unless-stopped
    depends_on: [site]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домен и почта для Let's Encrypt берутся из .env
      SITE_DOMAIN: ${SITE_DOMAIN:?укажите SITE_DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?укажите ACME_EMAIL в .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # сертификаты — переживают пересоздание контейнера
      - caddy_config:/config
    networks: [wheel]

networks:
  wheel:

volumes:
  caddy_data:
  caddy_config:
